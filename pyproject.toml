[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shiprisk"
version = "0.1.0"
description = "Score every commit for release risk using your own git history. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
shiprisk = "shiprisk.cli:main"

[tool.setuptools]
packages = ["shiprisk"]
